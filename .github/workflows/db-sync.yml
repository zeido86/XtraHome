name: Database Sync

on:
  workflow_dispatch:
    inputs:
      force_reset:
        description: "Radera all data och bygg om schemat (krävs vid Device→Room-migrering)"
        required: true
        default: true
        type: boolean
      run_seed:
        description: "Kör seed efter db push"
        required: true
        default: true
        type: boolean

jobs:
  db-sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Reset and push Prisma schema
        if: ${{ inputs.force_reset }}
        run: npx prisma db push --force-reset --accept-data-loss

      - name: Push Prisma schema
        if: ${{ !inputs.force_reset }}
        run: npx prisma db push --accept-data-loss

      - name: Seed database
        if: ${{ inputs.run_seed }}
        run: npm run db:seed
